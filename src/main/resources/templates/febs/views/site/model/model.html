<div class="layui-fluid layui-anim febs-anim" id="febs-model" lay-title="模型管理">
    <div class="layui-row febs-container">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body febs-table-full">
                    <button class="layui-btn  layui-btn-sm layui-btn-primary" id="template-download">
                        <i class="layui-icon">&#xe82a;</i> 模板下载
                    </button>
                    <!--                    <button class="layui-btn  layui-btn-sm layui-btn-primary" id="export"-->
                    <!--                            shiro:hasPermission="label:export">-->
                    <!--                        <i class="layui-icon">&#xe7a8;</i> 导出Excel-->
                    <!--                    </button>-->
                    <button class="layui-btn  layui-btn-sm layui-btn-success" id="import">
                        <i class="layui-icon">&#xe7aa;</i> 导入Excel
                    </button>
                    <table lay-filter="modelTable" lay-data="{id: 'modelTable'}"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="none" type="text/javascript">
    layui.use(['jquery', 'table', 'febs', 'upload'], function () {
        var $ = layui.jquery,
            febs = layui.febs,
            upload = layui.upload,
            table = layui.table,
            $view = $('#febs-model'),
            tableIns;

        initTable();

        upload.render({
            elem: '#import',
            url: ctx + 'bim/import',
            accept: 'file',
            exts: 'xlsx', // 只能上传 .xlsx格式
            size: 5 * 1024, // kb
            before: function () {
                febs.view.loadBar.start();
            },
            done: function (res) {
                febs.view.loadBar.finish();
                if (res.code === 200) {
                    // 刷新 table
                    tableIns.reload({page: {curr: 1}});
                    var data = res.data;
                    // 弹出导入结果
                    // febs.modal.open('导入结果', 'model/import', {
                    //     area: $(window).width() <= 750 ? '95%' : '1000px',
                    //     data: data
                    // });
                }
            }, error: function (res) {
                //请求异常回调
                console.error(res);
                febs.view.loadBar.error();
                febs.alert.error('导入失败！');
            }
        });

        $view.on('click', '#template-download', function () {
            febs.download(ctx + 'resource/download/uuid/bim', null, 'Excel导入模板.xlsx');
        });

        $view.on('click', '#export', function () {
            var params = {};
            params.pageSize = $view.find(".layui-laypage-limits option:selected").val();
            params.pageNum = $view.find(".layui-laypage-em").next().html();
            febs.download(ctx + 'resource/download/uuid/model', params, 'Excel导出结果.xlsx');
        });

        function initTable() {
            tableIns = febs.table.init2({
                elem: $view.find('table'),
                id: 'modelTable',
                url: ctx + 'bim/all',
                cols: [[
                    {field: 'bimCode', title: 'BIM编码'},
                    {field: 'pillarCode', title: '支柱编码'},
                    {field: 'mileage', title: '里程'},
                    {field: 'line', title: '行别'},
                    {field: 'pillarModel', title: '支柱型号'},
                    {field: 'baseModel', title: '基础型号'},
                    {field: 'stayWire', title: '拉线'},
                    {field: 'stayWireBase', title: '拉线基础'},
                    {field: 'wbazth', title: '腕臂安装图号'},
                    {field: 'jcwxm', title: '接触网下锚'},
                    {field: 'zxmj', title: '中心锚结'},
                    {field: 'region', title: '区间/车站'},
                    {field: 'other', title: '其他'}
                ]]
            });
        }

    })
</script>
